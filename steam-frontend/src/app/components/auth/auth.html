<!--
  ARCHIVO: auth.html
  PROPÓSITO: Plantilla visual para el componente de Autenticación.
  Este archivo maneja ambas vistas (Iniciar Sesión y Crear Cuenta) en un mismo formulario.
  Utiliza directivas de Angular para intercambiar textos y campos dinámicamente
  dependiendo del estado de la variable `isLoginMode`.
-->

<div class="auth-container">
  <div class="auth-box">
    
    <!-- 
      LOGOTIPO Y TÍTULO DINÁMICO
      Usa interpolación de Angular {{ }} y un operador ternario para cambiar el título.
      Si isLoginMode es true dice "Inicia sesión...", si es false dice "Únete...".
    -->
    <h1 class="auth-logo">NE<span class="auth-logo__x">X</span>US</h1>
    <p class="auth-subtitle">{{ isLoginMode ? 'Inicia sesión en tu cuenta' : 'Únete a la comunidad' }}</p>

    <!-- 
      FORMULARIO PRINCIPAL
      (ngSubmit): Captura el evento de envío del formulario (al presionar Enter o hacer clic en submit)
      y ejecuta la función onSubmit() definida en el archivo auth.ts, evitando que la página se recargue.
    -->
    <form (ngSubmit)="onSubmit()" class="auth-form">
      
      <!-- CAMPO: Nombre de usuario -->
      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <!-- 
          [(ngModel)]: Sincronización bidireccional (Two-Way Data Binding).
          Lo que el usuario escriba aquí actualizará automáticamente la variable 'username' en TypeScript, 
          y si TypeScript cambia la variable, se reflejará aquí.
        -->
        <input type="text" id="username" name="username" [(ngModel)]="username" required placeholder="Tu nombre en NEXUS">
      </div>

      <!-- 
        CAMPO: Correo Electrónico (CONDICIONAL)
        Usando la sintaxis moderna @if, este bloque HTML completo se elimina del DOM
        si el usuario está en modo Login, y se inyecta solo si está en modo Registro.
      -->
      @if (!isLoginMode) {
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="tu@correo.com">
        </div>
      }

      <!-- CAMPO: Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required placeholder="••••••••">
      </div>

      <!-- 
        MANEJO DE ERRORES EN PANTALLA
        Si la API de Django devuelve un error (ej. "Contraseña incorrecta"), 
        la variable errorMessage se llena y este bloque aparece automáticamente para avisarle al usuario.
      -->
      @if (errorMessage) {
        <div class="error-message">{{ errorMessage }}</div>
      }

      <!-- 
        BOTÓN DE ACCIÓN DINÁMICO
        El texto del botón cambia según el modo actual.
      -->
      <button type="submit" class="btn-submit">
        {{ isLoginMode ? 'Ingresar' : 'Crear cuenta' }}
      </button>

    </form>

    <!-- 
      ALTERNADOR DE MODOS (TOGGLE)
      Enlace/Botón inferior para cambiar entre Iniciar Sesión y Registro.
      Llama al método toggleMode() en auth.ts que invierte el valor de isLoginMode.
    -->
    <div class="auth-switch">
      <p>
        {{ isLoginMode ? '¿No tienes cuenta?' : '¿Ya tienes una cuenta?' }}
        <button type="button" class="btn-switch" (click)="toggleMode()">
          {{ isLoginMode ? 'Regístrate aquí' : 'Inicia sesión' }}
        </button>
      </p>
    </div>

  </div>
</div>
